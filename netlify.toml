[build]
  publish = "."
  command = "echo \"No build needed for static frontend.\""

[[redirects]]
  from = "/api/*"
  to = "https://your-backend.example.com/:splat"
  status = 200
  force = true

# Update the `to` URL to your deployed Python backend.
# Netlify will proxy any `/api/*` requests to that backend for the web UI.
